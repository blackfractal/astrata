<style>
#astrata-horizontal { --forest:#101f19; --panel:#1b3026; --line:#52654d; --gold:#dcc58c; --ink:#f0e8d3; --muted:#b4bfae; font:14px Georgia,serif; color:var(--ink); background:var(--forest); padding:18px; box-sizing:border-box; }
#astrata-horizontal * { box-sizing:border-box; }
#astrata-horizontal button { font:inherit; color:inherit; background:#23382c; border:1px solid var(--line); padding:8px; border-radius:3px; cursor:pointer; }
#astrata-horizontal button:hover { border-color:var(--gold); }
#astrata-horizontal button:disabled { cursor:default; opacity:.4; }
#astrata-horizontal .ah-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:15px; flex-wrap:wrap; }
#astrata-horizontal .ah-brand { color:var(--gold); letter-spacing:4px; font-size:22px; }
#astrata-horizontal .ah-sub { color:var(--muted); font:12px system-ui,sans-serif; }
#astrata-horizontal .ah-phases { display:grid; grid-template-columns:1fr 28px 1fr 36px 1fr 36px 1fr; align-items:stretch; border-bottom:1px solid var(--line); padding-bottom:12px; gap:4px; }
#astrata-horizontal .ah-phase { text-align:center; padding:8px 3px; color:var(--muted); }
#astrata-horizontal .ah-phase[aria-current] { background:#d4bc7e; color:#17251b; }
#astrata-horizontal .ah-auto { align-self:center; text-align:center; color:var(--line); }
#astrata-horizontal .ah-resources { display:flex; justify-content:center; gap:18px; padding:12px; font-size:15px; }
#astrata-horizontal .ah-resources span { padding:5px; }
#astrata-horizontal .ah-resources .ah-inuse { outline:1px solid #a4d5a1; border-radius:4px; background:#274330; }
#astrata-horizontal .ah-stage { display:grid; grid-template-columns:minmax(145px,.95fr) minmax(0,2.9fr) minmax(135px,1fr); gap:18px; align-items:center; }
#astrata-horizontal .ah-player { display:grid; grid-template-columns:40px minmax(45px,1fr) 40px; gap:7px; align-items:center; text-align:center; }
#astrata-horizontal .ah-equipment { padding:6px 2px; min-height:40px; }
#astrata-horizontal .ah-equipment small { display:block; font:10px system-ui,sans-serif; margin-top:2px; }
#astrata-horizontal .ah-head { grid-column:2; }
#astrata-horizontal .ah-neck { grid-column:2; }
#astrata-horizontal .ah-portrait { grid-column:2; grid-row:3 / 5; background:linear-gradient(#294438,#101d17); align-self:stretch; display:flex; flex-direction:column; justify-content:center; align-items:center; border:1px solid #718362; gap:8px; }
#astrata-horizontal .ah-portrait svg { width:38px; height:48px; color:#c7d2ac; }
#astrata-horizontal .ah-wrist-l { grid-column:1;grid-row:3; }
#astrata-horizontal .ah-wrist-r { grid-column:3;grid-row:3; }
#astrata-horizontal .ah-ring-l { grid-column:1;grid-row:4; }
#astrata-horizontal .ah-ring-r { grid-column:3;grid-row:4; }
#astrata-horizontal .ah-armor { grid-column:2;grid-row:5; }
#astrata-horizontal .ah-hp { grid-column:1 / 4; padding-top:4px; }
#astrata-horizontal .ah-health { height:5px; background:#303e30; margin-top:7px; }
#astrata-horizontal .ah-health b { display:block; background:#a98168; height:100%; }
#astrata-horizontal .ah-blockready { border-color:#9cdec4; box-shadow:0 0 0 2px #7acfba40,0 0 16px #7acfba55; }
#astrata-horizontal .ah-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); grid-template-rows:repeat(4,72px); gap:5px; padding:8px; border:1px solid #819071; background:radial-gradient(ellipse at center,#294834,#172820); }
#astrata-horizontal .ah-cell { min-width:0; border:1px solid #68805b60; background:#101c1760; padding:6px 4px; display:flex; flex-direction:column; justify-content:space-between; overflow-wrap:anywhere; font:12px system-ui,sans-serif; }
#astrata-horizontal .ah-cell.ah-placed { background:linear-gradient(130deg,#36462b,#17271e); border-color:#a08f5a; }
#astrata-horizontal .ah-cell b { font-weight:500; color:var(--gold); }
#astrata-horizontal .ah-cell small { color:#d1d9c9; font-size:11px; }
#astrata-horizontal .ah-enemies { display:grid; gap:7px; align-content:center; }
#astrata-horizontal .ah-enemy { text-align:left; padding:9px; background:#21362a; }
#astrata-horizontal .ah-enemyline { display:flex; gap:7px; align-items:center; }
#astrata-horizontal .ah-foe-art { color:#cfba8b; }
#astrata-horizontal .ah-enemy strong { display:block; font-size:14px; font-weight:500; }
#astrata-horizontal .ah-intent { display:block; color:#f2b99a; font:12px system-ui,sans-serif; margin-top:6px; }
#astrata-horizontal .ah-enemy small { display:block; color:var(--muted); font:11px system-ui,sans-serif; margin-top:4px; }
#astrata-horizontal .ah-enemies.ah-crowded .ah-enemy { padding:5px 8px; }
#astrata-horizontal .ah-enemies.ah-crowded .ah-health { display:none; }
#astrata-horizontal .ah-hand-wrap { padding-top:18px; margin-top:16px; border-top:1px solid var(--line); }
#astrata-horizontal .ah-handlabel { display:flex; justify-content:space-between; gap:12px; font:11px system-ui,sans-serif; color:var(--muted); margin-bottom:10px; }
#astrata-horizontal .ah-hand { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
#astrata-horizontal .ah-handcard { position:relative; text-align:left; width:122px; min-height:119px; padding:10px; background:linear-gradient(145deg,#334a34,#17271f); display:flex; flex-direction:column; gap:8px; }
#astrata-horizontal .ah-handcard:hover { transform:translateY(-5px); }
#astrata-horizontal .ah-handcard .ah-cost { align-self:flex-start; border:1px solid var(--gold); border-radius:50%; min-width:20px; text-align:center; font:12px system-ui,sans-serif; }
#astrata-horizontal .ah-handcard strong { color:var(--gold);font-size:14px;font-weight:500; }
#astrata-horizontal .ah-handcard small { font:11px system-ui,sans-serif; }
#astrata-horizontal .ah-active-intent { outline:1px solid #eba58d; }
@media(max-width:820px) { #astrata-horizontal {padding:12px;} #astrata-horizontal .ah-stage {gap:10px;grid-template-columns:145px minmax(0,1fr) 135px;} #astrata-horizontal .ah-grid {padding:5px;gap:3px;} }
@media(max-width:670px) { #astrata-horizontal .ah-stage {grid-template-columns:1fr;} #astrata-horizontal .ah-player {width:190px;justify-self:center;} #astrata-horizontal .ah-grid {grid-template-rows:repeat(4,76px);} #astrata-horizontal .ah-enemies {grid-template-columns:repeat(2,minmax(0,1fr));} #astrata-horizontal .ah-resources {gap:9px;} #astrata-horizontal .ah-phases {grid-template-columns:1fr 15px 1fr 23px 1fr 23px 1fr;font-size:11px;gap:1px;} #astrata-horizontal .ah-phases button {padding:2px;} #astrata-horizontal .ah-brand {font-size:18px;} }
</style>
<div id="astrata-horizontal" aria-label="Astrata horizontal battle layout concept">
  <div class="ah-header"><span class="ah-brand">ASTRATA</span><span class="ah-sub">Stratum 1 · Battle turn 3</span><span class="ah-sub">Grimoire · Inventory · Menu</span></div>
  <nav class="ah-phases" aria-label="Battle phases"><span class="ah-phase" data-phase="Reveal">Reveal</span><span class="ah-auto">→</span><span class="ah-phase" data-phase="Placement">Placement</span><button type="button" data-next="Activation" aria-label="Begin activation">→</button><span class="ah-phase" data-phase="Activation">Activation</span><button type="button" data-next="Enemy" aria-label="End player turn">→</button><span class="ah-phase" data-phase="Enemy">Enemy</span></nav>
  <div class="ah-resources"><span data-resource="Reveal">0 Insight</span><span data-resource="Placement">1 Focus</span><span data-resource="Activation">2 Channel</span></div>
  <div class="ah-stage">
    <div class="ah-player" aria-label="Druid and equipped items">
      <button class="ah-equipment ah-head" type="button" data-tooltip="Head equipment" aria-label="Head"><i data-lucide="crown" aria-hidden="true"></i><small>Head</small></button>
      <button class="ah-equipment ah-neck" type="button" data-tooltip="Neck equipment" aria-label="Neck"><i data-lucide="gem" aria-hidden="true"></i><small>Neck</small></button>
      <div class="ah-portrait"><i data-lucide="tree-pine" aria-hidden="true"></i><span>Druid</span></div>
      <button class="ah-equipment ah-wrist-l" type="button" data-tooltip="Left wrist: Bronze Bracelet · 2 block remaining" aria-label="Left wrist"><i data-lucide="shield" aria-hidden="true"></i><small>L · 2</small></button>
      <button class="ah-equipment ah-wrist-r" type="button" data-tooltip="Right wrist: empty" aria-label="Right wrist"><i data-lucide="circle-dashed" aria-hidden="true"></i><small>R</small></button>
      <button class="ah-equipment ah-ring-l" type="button" data-tooltip="Left ring: Rootbound Ring · first-attack bonus" aria-label="Left ring"><i data-lucide="circle" aria-hidden="true"></i><small>L</small></button>
      <button class="ah-equipment ah-ring-r" type="button" data-tooltip="Right ring: empty" aria-label="Right ring"><i data-lucide="circle-dashed" aria-hidden="true"></i><small>R</small></button>
      <button class="ah-equipment ah-armor" type="button" data-tooltip="Armor · automatic mitigation when the attack reaches the player" aria-label="Armor"><i data-lucide="shirt" aria-hidden="true"></i><small>Armor</small></button>
      <div class="ah-hp">48 / 65 HP<div class="ah-health"><b style="width:74%"></b></div></div>
    </div>
    <div class="ah-grid" aria-label="Five-column, four-row Mind Grid"></div>
    <div class="ah-enemies" aria-label="Enemies and announced attacks"></div>
  </div>
  <div class="ah-hand-wrap"><div class="ah-handlabel"><span>REVEALED</span><span>Grimoire 8 · Discard 3 · Destroyed 0</span></div><div class="ah-hand">
    <button class="ah-handcard" type="button" data-tooltip="Blast · Attune. Deal 4 damage, +1 per adjacent Blast."><span class="ah-cost">1</span><strong>Blast</strong><small>Attune · Deal 4<br>2 uses</small></button>
    <button class="ah-handcard" type="button" data-tooltip="Shield · Attune. Add 4 block, +1 per adjacent Shield."><span class="ah-cost">1</span><strong>Shield</strong><small>Attune · Block 4<br>Unlimited uses</small></button>
    <button class="ah-handcard" type="button" data-tooltip="Clear Mind · +2 Insight next turn."><span class="ah-cost">0</span><strong>Clear Mind</strong><small>Insight +2<br>1 use</small></button>
    <button class="ah-handcard" type="button" data-tooltip="Sapling · Deal current HP as damage. Grows from neighboring cards."><span class="ah-cost">1</span><strong>Sapling</strong><small>Ally · 4 HP<br>2 uses</small></button>
  </div></div>
</div>
<script>
(()=>{
 const root=document.getElementById('astrata-horizontal');
 const state={phase:'Placement',enemies:3,gridEmphasis:'Balanced'};
 const placed={5:['Shield','4 block'],6:['Thorn Choir','10 damage'],7:['Sapling','6 HP'],11:['Blast','4 damage']};
 const grid=root.querySelector('.ah-grid');
 for(let i=0;i<20;i++){const cell=document.createElement('div');cell.className='ah-cell'+(placed[i]?' ah-placed':'');if(placed[i]){const title=document.createElement('b');title.textContent=placed[i][0];const value=document.createElement('small');value.textContent=placed[i][1];cell.append(title,value);}grid.append(cell);}
 function render(){
  root.querySelector('[data-resource="Reveal"]').textContent=(state.phase==='Reveal'||state.phase==='Enemy'?4:0)+' Insight';
  root.querySelectorAll('[data-phase]').forEach(el=>{if(el.dataset.phase===state.phase)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');});
  root.querySelectorAll('[data-resource]').forEach(el=>el.classList.toggle('ah-inuse',el.dataset.resource===state.phase));
  root.querySelector('[data-next="Activation"]').disabled=state.phase!=='Placement';root.querySelector('[data-next="Enemy"]').disabled=state.phase!=='Activation';
  root.querySelector('.ah-wrist-l').classList.toggle('ah-blockready',state.phase==='Enemy');
  root.querySelector('.ah-stage').style.setProperty('column-gap',state.gridEmphasis==='Larger grid'?'8px':'18px');
  const foes=root.querySelector('.ah-enemies');foes.classList.toggle('ah-crowded',state.enemies>3);foes.replaceChildren();
  const names=['Bat','Bell Beetle','Fire Wolf','Bat','Needle Imp'], stats=['15 / 15 HP','21 / 21 HP','17 / 17 HP','15 / 15 HP','18 / 18 HP'], intents=['4 Wind','Guard 5','10 Fire + Burn','4 Wind','3 Chaos · Pierce'];
  for(let i=0;i<state.enemies;i++){const enemy=document.createElement('button');enemy.type='button';enemy.className='ah-enemy'+(state.phase==='Enemy'&&i===0?' ah-active-intent':'');enemy.setAttribute('data-tooltip',names[i]+' · '+intents[i]);enemy.innerHTML='<span class="ah-enemyline"><i class="ah-foe-art" data-lucide="'+(i===1?'bug':i===2?'flame':'bird')+'" aria-hidden="true"></i><strong>'+names[i]+'</strong></span><small>'+stats[i]+'</small><div class="ah-health"><b style="width:100%"></b></div><span class="ah-intent">'+intents[i]+'</span>';foes.append(enemy);}
  globalThis.lucide?.createIcons({attrs:{width:18,height:18}});
 }
 root.querySelectorAll('[data-next]').forEach(el=>el.addEventListener('click',()=>{state.phase=el.dataset.next;render();}));
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(state,'phase',{label:'Battle phase',options:['Reveal','Placement','Activation','Enemy']});tweak.addSlider(state,'enemies',{label:'Enemy count',min:1,max:5,step:1});tweak.addSelect(state,'gridEmphasis',{label:'Spacing',options:['Balanced','Larger grid']});}
})();
</script>
